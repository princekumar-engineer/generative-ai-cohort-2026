services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chaibook-postgres
    environment:
      POSTGRES_DB: chaibook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - chaibook_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chaibook"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  chaibook_pg_data: